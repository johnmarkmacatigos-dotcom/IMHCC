name: Deploy to Vercel

# The Vercel account (mokong-hubs-projects) signs in to GitHub as a different
# user, so Vercel's own Git integration can't see this repository. This
# workflow builds and deploys with the Vercel CLI instead.
#
# Needs one repository secret: VERCEL_TOKEN (a token from the Vercel account).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_Af5QalG3zrqSxyhs86yKrBFY
  VERCEL_PROJECT_ID: prj_0sVanuBzvCEZaXUK5voaC2MDAiot

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
