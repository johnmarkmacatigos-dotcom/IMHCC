# Temporary hosting on Netlify (free) until the Vercel account is available.
# The Next.js plugin turns the build into Netlify functions and static files;
# without it Netlify uploads the build but serves a 404 for every page.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"
